name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  build:
    uses: openworks-lab/actions/.github/workflows/dockerfile-build-and-push.yml@main
    with:
      env: prod                               # EDIT dev|prod
      service_slug: api-server                # EDIT
      dockerfile: docker/Dockerfile.api-server  # EDIT
      push: true
  deploy:
    needs: build
    uses: openworks-lab/actions/.github/workflows/ecs-deploy.yml@main
    with:
      env: prod                               # EDIT dev|prod — MUST match build job above
      service_slug: api-server                # EDIT — MUST match build job (M6 image-prefix check)
      cluster: prod-open-echo                 # EDIT
      service: prod-open-echo-api             # EDIT
      image: ${{ needs.build.outputs.image-uri }}
