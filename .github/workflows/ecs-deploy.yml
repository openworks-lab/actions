name: ecs-deploy

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      service_slug:
        description: "Concurrency key + image-prefix check"
        type: string
        required: true
      cluster:
        type: string
        required: true
      service:
        type: string
        required: true
      image:
        description: "Full image URI from dockerfile-build-and-push.yml"
        type: string
        required: true
      aws-region:
        type: string
        default: ap-northeast-2
      wait-stable:
        type: boolean
        default: true
    outputs:
      task-definition-arn:
        value: ${{ jobs.deploy.outputs.task-definition-arn }}

concurrency:
  group: ecs-${{ inputs.env }}-${{ inputs.service_slug }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      task-definition-arn: ${{ steps.register.outputs.arn }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate identity + image prefix (M3, M6 — fail-fast)
        env:
          ENV: ${{ inputs.env }}
          SVC: ${{ inputs.service_slug }}
          IMG: ${{ inputs.image }}
          REGION: ${{ inputs.aws-region }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%%/*}"; PROJECT="${GITHUB_REPOSITORY#*/}"
          [ "$OWNER" = "openworks-lab" ] || { echo "::error::owner != openworks-lab"; exit 1; }
          case "$ENV" in dev|prod) : ;; *) echo "::error::env must be dev|prod"; exit 1 ;; esac
          RE='^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$'
          [[ "$PROJECT" =~ $RE && "$SVC" =~ $RE ]] || { echo "::error::slug regex"; exit 1; }
          PREFIX="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${REGION}.amazonaws.com/${ENV}-${PROJECT}/${SVC}:"
          case "$IMG" in
            "${PREFIX}"*) : ;;
            *) echo "::error::image '$IMG' must start with '$PREFIX' (M6)"; exit 1 ;;
          esac

      - name: Configure AWS credentials (OIDC, internal role — M1)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ inputs.env }}-gha-deployer
          aws-region: ${{ inputs.aws-region }}

      # P5 V1.1 fix — family latest ACTIVE rev base capture (NOT service.taskDefinition).
      #
      # V1.0 시점 capture = describe-services 의 service.taskDefinition. 그러나 terraform
      # aws_ecs_service.lifecycle.ignore_changes = [task_definition] 가 *service.taskDefinition
      # 갱신 막음* → terraform 의 새 rev (env_vars 변경 적용) 가 CI capture 에 반영 안 됨
      # → CI 가 옛 rev base 잡고 image swap → terraform env_vars 변경 영구 deploy 안 됨
      # (P5 break-fix loop 8건 중 3건의 직접 원인). V1.1 fix = family latest ACTIVE rev base.
      # terraform 새 register = 자동 deploy.
      - name: Capture base task-def (family latest ACTIVE)
        id: base
        env:
          SERVICE: ${{ inputs.service }}
          ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          # family name = service name (modules/fargate-service local.family = local.name).
          FAMILY="$SERVICE"
          case "$FAMILY" in
            ${ENV}-*) : ;;
            *) echo "::error::family '$FAMILY' must start with '${ENV}-'"; exit 1 ;;
          esac

          # describe-task-definition --task-definition <family> = latest ACTIVE revision.
          aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition' --output json > /tmp/cur-td.json
          BASE_ARN="$(jq -r '.taskDefinitionArn' /tmp/cur-td.json)"
          [ -n "$BASE_ARN" ] && [ "$BASE_ARN" != "null" ] || { echo "::error::family '$FAMILY' has no ACTIVE task definition (terraform apply prerequisite)"; exit 1; }
          STATUS="$(jq -r '.status' /tmp/cur-td.json)"
          [ "$STATUS" = "ACTIVE" ] || { echo "::error::latest task def '$BASE_ARN' status='$STATUS' (not ACTIVE)"; exit 1; }

          echo "base-arn=$BASE_ARN" >> "$GITHUB_OUTPUT"
          echo "family=$FAMILY" >> "$GITHUB_OUTPUT"
          echo "Captured base: $BASE_ARN (family latest ACTIVE)"

      # Guard A — capture 후 family 에 새 rev 가 등록됐는지 검증 (다른 CI run 또는 terraform 의 race).
      # 변경 감지 = abort fail-closed + 재시도 (capture 단계 부터 다시 = 그 새 rev base 채택).
      - name: "Guard A — abort if family latest moved before register"
        env:
          FAMILY: ${{ steps.base.outputs.family }}
          BASE: ${{ steps.base.outputs.base-arn }}
        run: |
          set -euo pipefail
          NOW="$(aws ecs describe-task-definition --task-definition "$FAMILY" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          [ "$NOW" = "$BASE" ] || { echo "::error::concurrent register detected (family latest moved $BASE → $NOW). Aborting fail-closed; re-run."; exit 1; }

      - name: Build drift-safe revision (composite action — M8)
        uses: openworks-lab/actions/.github/actions/ecs-taskdef-transform@main
        with:
          src-json: /tmp/cur-td.json
          new-image: ${{ inputs.image }}
          out-json: /tmp/new-td.json

      - name: Register new task definition (as-built ABAC tags)
        id: register
        env:
          ENV: ${{ inputs.env }}
        run: |
          set -euo pipefail
          PROJECT="${GITHUB_REPOSITORY#*/}"
          ARN="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-td.json \
            --tags key=Org,value=openworks-lab key=Env,value="$ENV" \
                   key=Project,value="$PROJECT" key=ManagedBy,value=terraform \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      # Guard B — register 직전 family latest 가 BASE 와 일치 검증 (V1.1).
      # register-task-definition 후 family latest = 우리 새 rev. Guard B 는 *register 전*
      # family latest 가 *capture 시점 BASE* 와 동일한지 다시 확인 (다른 race 없었는지).
      # 우리 NEW_ARN 는 *이미 register 됐음* — abort 시 그 rev 는 사용되지 않은 채 family 에 남음.
      - name: "Guard B — abort if family moved between capture and register"
        env:
          FAMILY: ${{ steps.base.outputs.family }}
          BASE: ${{ steps.base.outputs.base-arn }}
          NEW_ARN: ${{ steps.register.outputs.arn }}
        run: |
          set -euo pipefail
          # 우리 새 rev 보다 *앞* 의 rev 가 BASE 였는지. NEW_ARN 의 family 안 *직전 rev* = BASE 여야.
          # describe-task-definition 의 latest 가 NEW_ARN (우리 register 결과). 한 단계 앞 = BASE.
          # 검증 = NEW_ARN 의 family + revision-1 = BASE 의 revision.
          NEW_REV="$(echo "$NEW_ARN" | awk -F: '{print $NF}')"
          BASE_REV="$(echo "$BASE" | awk -F: '{print $NF}')"
          EXPECTED_BASE_REV=$((NEW_REV - 1))
          [ "$BASE_REV" = "$EXPECTED_BASE_REV" ] || { echo "::error::race detected — base rev=$BASE_REV, new rev=$NEW_REV (expected base=$EXPECTED_BASE_REV). Other actor registered between capture and register. New rev $NEW_ARN left registered/unused; re-run."; exit 1; }

      - name: Update service
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
        # V1.0 known limitation: a ~sub-second TOCTOU window remains between
        # Guard B and this update-service (cross-tool/Terraform race; not the
        # same concurrency group). Image deployed is always inputs.image — the
        # residual risk is overwriting a concurrent Terraform-set revision, not
        # a wrong-image deploy. Accepted per ADR-0006; deterministic lock = V1.1.
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "${{ steps.register.outputs.arn }}" >/dev/null

      - name: Wait for service stable
        if: ${{ inputs.wait-stable }}
        env:
          CLUSTER: ${{ inputs.cluster }}
          SERVICE: ${{ inputs.service }}
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
