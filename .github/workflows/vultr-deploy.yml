name: vultr-deploy

on:
  workflow_call:
    inputs:
      image_tag:
        description: "불변 이미지 태그 (main-<sha>)"
        required: true
        type: string
    secrets:
      VULTR_HOST:
        required: true
      VULTR_HOST_KEY:
        required: true
      VULTR_DEPLOY_SSH_KEY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: caller allowlist (fail-closed)
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            openworks-lab/developer-portal) echo "caller ok: $GITHUB_REPOSITORY" ;;
            *) echo "::error::vultr-deploy is restricted to developer-portal (got $GITHUB_REPOSITORY)"; exit 1 ;;
          esac

      - name: image_tag 형식 검증
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          echo "$IMAGE_TAG" | grep -Eq '^main-[0-9a-f]{7,40}$' \
            || { echo "::error::image_tag must match main-<sha>"; exit 1; }

      - name: OIDC assume (pull-only 세션, prod-gha-deployer — M1 조립 관례)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/prod-gha-deployer
          aws-region: ap-northeast-2
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},
              {"Effect":"Allow",
               "Action":["ecr:BatchCheckLayerAvailability","ecr:GetDownloadUrlForLayer","ecr:BatchGetImage"],
               "Resource":"arn:aws:ecr:ap-northeast-2:${{ vars.AWS_ACCOUNT_ID }}:repository/prod-developers/*"}]}

      - name: mint ECR token + SSH deploy
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_HOST_KEY: ${{ secrets.VULTR_HOST_KEY }}
          VULTR_DEPLOY_SSH_KEY: ${{ secrets.VULTR_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          REG="${AWS_ACCOUNT_ID}.dkr.ecr.ap-northeast-2.amazonaws.com"
          TOKEN="$(aws ecr get-login-password --region ap-northeast-2)"
          echo "::add-mask::$TOKEN"
          install -d -m 700 ~/.ssh
          printf '%s %s\n' "$VULTR_HOST" "$VULTR_HOST_KEY" > ~/.ssh/known_hosts
          printf '%s\n' "$VULTR_DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts \
            "deploy@${VULTR_HOST}" "$REG $TOKEN $IMAGE_TAG"
